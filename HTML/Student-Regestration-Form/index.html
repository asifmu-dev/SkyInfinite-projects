<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Registration Form</title>
</head>

<body>

  <header>
    <h1>Student Registration Form</h1>
    <p>Fields marked with * are required.</p>
  </header>

  <main>
    <form action="#">
      <section>
        <h2>Personal Information</h2>
        <div>
          <label>Full Name *</label>
          <br>
          <input type="text" name="fullname" placeholder="Enter your full name" required>
        </div>
        <br>

        <div>
          <label>Email *</label>
          <br>
          <input type="email" name="email" placeholder="you@example.com" required>
        </div>
        <br>

        <div>
          <label>Phone *</label>
          <br>
          <input type="tel" name="phone" placeholder="03001234567" pattern="[0-9]{11}" title="Enter an 11-digit phone number" required>
        </div>
        <br>

        <div>
          <label>Date of Birth *</label>
          <br>
          <input type="date" name="dob" required>
        </div>
        <br>

        <div>
          <strong>Gender *</strong>
          <br>
            <input type="radio" name="gender" value="male" required> Male</label>
            <br>
            <input type="radio" name="gender" value="female"> Female</label>
            <br>
            <input type="radio" name="gender" value="other"> Other</label>
        </div>
      </section>
      <br>

      <section>
        <h2>Course Details</h2>

        <div>
          <label>Course *</label>
          <br>
          <select name="course" required>
            <option value="">-- Select a course --</option>
            <option value="web-development">Web Development</option>
            <option value="software-engineering">Software Engineering</option>
            <option value="data-science">Data Science</option>
            <option value="graphic-design">Graphic Design</option>
            <option value="digital-marketing">Digital Marketing</option>
          </select>
        </div>
        <br>

        <div>
          <strong>Skills</strong>
          <br>
          <label><input type="checkbox" name="skills" value="html"> HTML</label>
          <br>
          <label><input type="checkbox" name="skills" value="css"> CSS</label>
          <br>
          <label><input type="checkbox" name="skills" value="javascript"> JavaScript</label>
          <br>
          <label><input type="checkbox" name="skills" value="react"> React</label>
          <br>
          <label><input type="checkbox" name="skills" value="nodejs"> Node.js</label>
        </div>
      </section>
      <br>

      <section>
        <h2>Additional Information</h2>

        <div>
          <label>Address *</label>
          <br>
          <textarea name="address" rows="3" cols="40" placeholder="House no., street, city" required></textarea>
        </div>
        <br>

        <div>
          <label>Message</label>
          <br>
          <textarea name="message" rows="4" cols="40" placeholder="Anything you would like us to know (optional)"></textarea>
        </div>
      </section>
      <br>

      <section>
        <button type="submit">Submit</button>
        <button type="reset">Reset</button>
      </section>
    </form>
  </main>

</body>
</html>
